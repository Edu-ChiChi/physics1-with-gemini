<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상명대 일반물리학Ⅰ 기말고사 메이트</title>
  
  <!-- React & Standalone Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- KaTeX 수학 수식 엔진 CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;850;900&family=Noto+Sans+KR:wght@300;400;550;700;900&display=swap');
    
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased leading-relaxed">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 고성능 커스텀 SVG 아이콘 모음 (외부 의존성 제로화) ---
    const IconBookOpen = () => (
      <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
    );

    const IconRotateCcw = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
    );

    const IconEye = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    );

    const IconEyeOff = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
      </svg>
    );

    const IconCheckCircle = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconCompass = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9s2.015-9 4.5-9m0 0a9.003 9.003 0 018.716 2.253M12 3a9.003 9.003 0 00-8.716 2.253M12 12h.01" />
      </svg>
    );

    const IconZap = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
      </svg>
    );

    const IconAward = () => (
      <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.504-1.125-1.125-1.125h-6.75a1.125 1.125 0 00-1.125 1.125v3.375m9 0h-9" />
      </svg>
    );

    const IconSliders = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75" />
      </svg>
    );

    const IconClipboard = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
      </svg>
    );

    // --- 고정밀 실시간 수식 렌더러 ---
    const MathFormula = ({ math, block = false }) => {
      const elRef = useRef(null);
      useEffect(() => {
        if (window.katex && elRef.current) {
          try {
            window.katex.render(math, elRef.current, {
              throwOnError: false,
              displayMode: block,
            });
          } catch (e) {
            elRef.current.textContent = math;
          }
        } else if (elRef.current) {
          elRef.current.textContent = math;
        }
      }, [math, block]);

      return <span ref={elRef} className={`${block ? 'block my-3 text-center overflow-x-auto py-2' : 'inline-block px-1'}`} />;
    };

    // --- 메인 App 컴포넌트 ---
    function App() {
      const [showAll, setShowAll] = useState(false);
      const [userAnswers, setUserAnswers] = useState({});
      const [activeTab, setActiveTab] = useState('exam_full'); // 'exam_full' | 'lecture_notes' | 'chem_physics' | 'formulas_all'
      const [score, setScore] = useState(0);

      // 전체 빈칸 총 개수 매핑 (총 80개로 확장)
      const TOTAL_BLANKS = 80;

      const toggleBlank = (id) => {
        setUserAnswers(prev => ({
          ...prev,
          [id]: !prev[id]
        }));
      };

      const handleToggleAll = () => {
        const newState = !showAll;
        setShowAll(newState);
        const updated = {};
        for (let i = 1; i <= TOTAL_BLANKS; i++) {
          updated[`q${i}`] = newState;
        }
        setUserAnswers(updated);
      };

      useEffect(() => {
        const count = Object.values(userAnswers).filter(v => v).length;
        setScore(count);
      }, [userAnswers]);

      const handleReset = () => {
        setUserAnswers({});
        setShowAll(false);
        setScore(0);
      };

      // --- 실시간 수식 매칭형 빈칸 카드 컴포넌트 ---
      const Blank = ({ id, answer, hint, isMath = false }) => {
        const isRevealed = userAnswers[id] || showAll;
        return (
          <span
            onClick={() => toggleBlank(id)}
            title={hint ? `힌트: ${hint}` : '클릭해서 정답 보기'}
            className={`inline-flex items-center justify-center mx-1 px-3.5 py-1 rounded-lg cursor-pointer transition-all duration-300 transform font-bold select-none border-b-2 ${
              isRevealed
                ? 'bg-amber-50 text-amber-950 border-amber-400 scale-100 shadow-sm'
                : 'bg-indigo-100 text-indigo-100 hover:bg-indigo-200 border-indigo-300 animate-pulse min-w-[5.5rem]'
            }`}
          >
            {isRevealed ? (
              isMath ? <MathFormula math={answer} /> : answer
            ) : (
              '❔'
            )}
          </span>
        );
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 text-white shadow-xl border-b border-indigo-500/30 sticky top-0 z-50">
            <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-indigo-600 rounded-xl shadow-lg">
                  <IconBookOpen />
                </div>
                <div>
                  <h1 className="text-xl font-black tracking-tight flex items-center gap-2">
                    일반물리학Ⅰ <span className="text-xs bg-indigo-500/50 text-indigo-200 px-2 py-0.5 rounded-full font-bold">기말고사 메이트</span>
                  </h1>
                  <p className="text-xs text-slate-400 font-medium">상명대학교 화학에너지공학 복수전공 맞춤형 융합 학습기</p>
                </div>
              </div>

              <div className="flex items-center gap-3 flex-wrap">
                <div className="text-xs font-semibold px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg flex items-center gap-2">
                  <IconAward />
                  <span>인출 성취율: <span className="text-indigo-400 font-bold">{score}</span> / {TOTAL_BLANKS}</span>
                </div>
                
                <button
                  onClick={handleToggleAll}
                  className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-lg transition-all border border-slate-700 hover:border-indigo-400 bg-slate-800 hover:bg-slate-750 text-slate-200"
                >
                  {showAll ? <IconEyeOff /> : <IconEye />}
                  {showAll ? '전체 가리기' : '정답 모두 보기'}
                </button>

                <button
                  onClick={handleReset}
                  className="p-1.5 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition-colors border border-transparent hover:border-slate-700"
                  title="초기화"
                >
                  <IconRotateCcw />
                </button>
              </div>
            </div>
          </header>

          {/* Hero Banner */}
          <section className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white py-8 px-4 border-b border-indigo-900">
            <div className="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="space-y-2 max-w-2xl">
                <div className="inline-flex items-center gap-1 bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full border border-amber-500/30 font-bold">
                  <IconZap className="w-3.5 h-3.5 fill-amber-300 text-amber-400" />
                  <span>2025학년도 1학기 기말고사 전 문항 및 기말 대비 모든 공식집 탑재</span>
                </div>
                <h2 className="text-2xl md:text-3xl font-extrabold tracking-tight">
                  단답형부터 정밀 이온 융합 역학까지 정복
                </h2>
                <p className="text-slate-300 text-sm leading-relaxed">
                  물음표 카드를 클릭하면 그리스 문자(<MathFormula math="\omega, \lambda, \epsilon, \eta" />)와 복잡한 분수 공식들이 즉시 아름다운 교과서식 수학 기호로 인출 및 시각화됩니다.
                </p>
              </div>
            </div>
          </section>

          {/* Navigation tabs */}
          <div className="bg-white border-b border-slate-200 sticky top-[73px] sm:top-[77px] z-40 shadow-sm">
            <div className="max-w-5xl mx-auto px-4 flex gap-2 overflow-x-auto">
              <button
                onClick={() => setActiveTab('exam_full')}
                className={`py-4 px-3 sm:px-5 font-bold text-sm border-b-2 transition-all flex items-center gap-2 whitespace-nowrap ${
                  activeTab === 'exam_full'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <IconCheckCircle />
                <span>2025 기말고사 전체 문항 복기</span>
              </button>
              
              <button
                onClick={() => setActiveTab('lecture_notes')}
                className={`py-4 px-3 sm:px-5 font-bold text-sm border-b-2 transition-all flex items-center gap-2 whitespace-nowrap ${
                  activeTab === 'lecture_notes'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <IconCompass />
                <span>주차별 강의 노트 단답 예상</span>
              </button>

              <button
                onClick={() => setActiveTab('chem_physics')}
                className={`py-4 px-3 sm:px-5 font-bold text-sm border-b-2 transition-all flex items-center gap-2 whitespace-nowrap ${
                  activeTab === 'chem_physics'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <IconZap className="w-4 h-4 text-amber-500" />
                <span>화에공 전지 물리 융합존 (확장)</span>
              </button>

              <button
                onClick={() => setActiveTab('formulas_all')}
                className={`py-4 px-3 sm:px-5 font-bold text-sm border-b-2 transition-all flex items-center gap-2 whitespace-nowrap ${
                  activeTab === 'formulas_all'
                    ? 'border-indigo-600 text-indigo-600'
                    : 'border-transparent text-slate-500 hover:text-slate-800'
                }`}
              >
                <IconClipboard />
                <span>기말 대비 전범위 공식집 (신설)</span>
              </button>
            </div>
          </div>

          {/* Main Content Areas */}
          <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
            
            {/* Tab 1: 2025 기말 기출 전 문항 복기 */}
            {activeTab === 'exam_full' && (
              <div className="space-y-8 animate-fadeIn">
                
                {/* 대문항 1 */}
                <div className="space-y-4">
                  <div className="pb-2 border-b border-slate-200 flex justify-between items-center">
                    <h3 className="text-lg font-black text-slate-900 flex items-center gap-2">
                      <span className="w-2.5 h-6 bg-indigo-600 rounded-sm"></span>
                      1. 다음 빈 칸을 채우세요 (개당 2점 - 총 50점)
                    </h3>
                    <span className="text-xs bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full font-bold">Q1 ~ Q25</span>
                  </div>

                  <div className="grid grid-cols-1 gap-4">
                    {/* Q1-1 */}
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <p className="text-slate-700 text-[15px] leading-relaxed">
                        (1) <Blank id="q1" answer="용수철 상수" hint="다른 말로 힘 상수, 탄성계수라고도 함" />는 용수철의 단위 <Blank id="q2" answer="변위" hint="원점으로부터의 위치 변화량" /> 변화량당 복원하려는 힘을 계수로 나타낸 것이다.
                      </p>
                    </div>

                    {/* Q1-2 */}
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <div className="space-y-3">
                        <p className="text-slate-700 text-[15px] leading-relaxed">
                          (2) 길이 <MathFormula math="A" /> 만큼 잡아당긴 후 <MathFormula math="\omega" />의 각진동수로 조화 진동하는 용수철의 위상 상수는 0이다. 이때 각각의 조화 운동 상태식은 다음과 같다.
                        </p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                          <div className="bg-slate-50 p-3 rounded-lg border border-slate-150 flex justify-between items-center">
                            <span className="text-xs font-bold text-slate-500">(a) 변위</span>
                            <Blank id="q3" answer="x(t) = A \cos(\omega t)" isMath hint="조화진동 변위 함수" />
                          </div>
                          <div className="bg-slate-50 p-3 rounded-lg border border-slate-150 flex justify-between items-center">
                            <span className="text-xs font-bold text-slate-500">(b) 가속도</span>
                            <Blank id="q4" answer="a(t) = -\omega^2 A \cos(\omega t)" isMath hint="변위의 두 번 미분" />
                          </div>
                          <div className="bg-slate-50 p-3 rounded-lg border border-slate-150 flex justify-between items-center">
                            <span className="text-xs font-bold text-slate-500">(c) 속도</span>
                            <Blank id="q5" answer="v(t) = -\omega A \sin(\omega t)" isMath hint="변위의 일차 미분" />
                          </div>
                          <div className="bg-slate-50 p-3 rounded-lg border border-slate-150 flex justify-between items-center">
                            <span className="text-xs font-bold text-slate-500">(d) 운동에너지</span>
                            <Blank id="q6" answer="E_k = \frac{1}{2}m\omega^2 A^2 \sin^2(\omega t)" isMath hint="1/2 * m * v^2" />
                          </div>
                          <div className="bg-slate-50 p-3 rounded-lg border border-slate-150 flex justify-between items-center">
                            <span className="text-xs font-bold text-slate-500">(e) 포텐셜에너지</span>
                            <Blank id="q7" answer="E_p = \frac{1}{2}kA^2 \cos^2(\omega t)" isMath hint="1/2 * k * x^2" />
                          </div>
                          <div className="bg-slate-50 p-3 rounded-lg border border-slate-150 flex justify-between items-center">
                            <span className="text-xs font-bold text-slate-500">(f) 역학적에너지</span>
                            <Blank id="q8" answer="E = \frac{1}{2}kA^2" isMath hint="포텐셜에너지와 운동에너지의 합" />
                          </div>
                        </div>
                        <div className="bg-indigo-50/50 p-3 rounded-lg text-sm text-slate-700 flex items-center justify-between">
                          <span>(g) 이때, 최대 가속도를 가지는 위치는 원점으로부터 가장 어떤가?</span>
                          <Blank id="q9" answer="멀다" hint="변위 크기가 양 끝점(A)일 때 복원력이 최대이므로" />
                        </div>
                      </div>
                    </div>

                    {/* Q1-3 */}
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <p className="text-slate-700 text-[15px] leading-relaxed">
                        (3) <Blank id="q10" answer="펄스" hint="영어로는 Pulse입니다" />는 일정한 주기로 반복되는 현상에서 발생하는 갑작스럽고 강렬한 변화 하나이며, <Blank id="q11" answer="파동" hint="영어로는 Wave입니다" />은 물질의 진동이 다른 곳으로 전파되는 현상이다. 즉, 앞 단어는 일시적인 뒷 단어의 현상이다.
                      </p>
                    </div>

                    {/* Q1-4 */}
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <p className="text-slate-700 text-[15px] leading-relaxed">
                        (4) 매질의 진동 방향과 파동의 진행 방향이 수직인 것은 <Blank id="q12" answer="횡파" hint="예: 빛, 전자기파" />이고, 매질의 진동 방향과 파동의 진행 방향이 평행인 것은 <Blank id="q13" answer="종파" hint="예: 음파, 초음파" />이다.
                      </p>
                    </div>

                    {/* Q1-5 */}
                    <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                      <p className="text-slate-700 text-[15px] leading-relaxed">

                      용수철 복원력 수식 <MathFormula math="F = -kx" /> 에서 탄성계수 앞에 기입되는 마이너스(<MathFormula math="-" />) 부호는 복원력 벡터의 방향이 변위 벡터 방향과 언제나 <Blank id="q47" answer="반대" hint="일반물리학 9주차 강의록" /> 방향으로 작용함을 뜻한다.

                      <p className="font-semibold mb-1 text-xs text-indigo-600">Q. 역학적 에너지 보존의 궤적</p>
                      에너지 보존에 입각한 물체의 위치 좌표 <MathFormula math="x" />와 매 순간의 이동 속도 <MathFormula math="v" />의 거동 방정식을 정규화하면 일치하는 기하학적 형상은 다음과 같으며, 이 형태를 <Blank id="q48" answer="타원 방정식" hint="위치와 속도의 위상 궤적" /> 형태라고 한다.

                      파동이 공간 상으로 전파되어 뻗어나갈 때, 파장의 전송을 담당하는 지점의 매질 자체가 외측으로 직접 천이하는 것이 아니라 매질 내부 분자들의 탄성 충돌 진동만을 유기하여 파동 수송 통로를 통해 최종적으로 <Blank id="q51" answer="에너지" hint="물리적 보존량" />가 한 곳에서 다른 곳으로 이동하는 것이다.
